<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARS · Chat</title>
<style>
:root{--bg:oklch(.145 0 0);--card:oklch(.175 0 0);--card2:oklch(.155 0 0);--fg:oklch(.985 0 0);--muted:oklch(.65 0 0);--faint:oklch(.42 0 0);--green:oklch(.723 .219 149.579);--border:oklch(1 0 0 / 9%);--soft:oklch(1 0 0 / 5%);--warn:oklch(.795 .161 82);--red:oklch(.704 .191 22.216);--mono:ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace;--sans:-apple-system,Inter,'Segoe UI',system-ui,sans-serif}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font:12.5px/1.5 var(--sans)}button,input,textarea,select{font:inherit;color:inherit}.shell{height:100vh;display:grid;grid-template:40px 1fr 22px/270px 1fr;grid-template-areas:'top top' 'side main' 'status status'}.top{grid-area:top;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--border);background:var(--card2)}.logo{width:22px;height:22px;background:var(--green);color:#04150b;display:grid;place-items:center;font:800 11px var(--mono);margin-right:10px}.crumb{font:11px var(--mono);color:var(--muted)}.crumb b{color:var(--fg)}.grow{flex:1}.top a{color:var(--muted);text-decoration:none;font:11px var(--mono);padding:0 12px;border-left:1px solid var(--soft)}.side{grid-area:side;border-right:1px solid var(--border);background:var(--card2);display:flex;flex-direction:column;min-height:0}.head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}.label{font:9.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}.new{margin:0 12px 10px;width:calc(100% - 24px)}.chat-list{overflow:auto}.chat{padding:10px 14px;border-bottom:1px solid var(--soft);cursor:pointer}.chat:hover,.chat.active{background:oklch(.723 .219 149.579 / 7%)}.chat.active{border-left:2px solid var(--green);padding-left:12px}.chat-title{font:11px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-meta{font:9.5px var(--mono);color:var(--faint);margin-top:3px}.main{grid-area:main;display:flex;flex-direction:column;min-width:0;min-height:0}.toolbar{height:49px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--card2)}.model{background:var(--card);border:1px solid var(--border);padding:6px 9px;min-width:220px}.state{font:10px var(--mono);color:var(--faint)}.state.loading{color:var(--warn)}.state.error{color:var(--red)}.messages{flex:1;overflow:auto;padding:24px max(20px,calc((100% - 880px)/2));min-height:0}.empty{text-align:center;color:var(--faint);font:11px var(--mono);padding-top:16vh}.msg{margin:0 auto 22px;max-width:880px}.role{font:9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}.bubble{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.65}.user .bubble{background:var(--card);border:1px solid var(--border);padding:12px 14px}.assistant .bubble{color:var(--fg)}.reasoning{margin:0 0 10px;border:1px solid var(--border);background:var(--card2)}.reasoning summary{cursor:pointer;padding:7px 10px;color:var(--muted);font:10px var(--mono)}.reasoning pre{margin:0;padding:10px;color:var(--faint);font:10.5px/1.55 var(--mono);white-space:pre-wrap;max-height:260px;overflow:auto;border-top:1px solid var(--soft)}.metrics{margin-top:8px;color:var(--faint);font:9.5px var(--mono)}.composer{border-top:1px solid var(--border);padding:14px max(20px,calc((100% - 880px)/2));background:var(--card2)}textarea{display:block;width:100%;resize:none;min-height:78px;max-height:220px;background:var(--card);border:1px solid var(--border);outline:0;padding:11px 12px;line-height:1.5}textarea:focus{border-color:oklch(.723 .219 149.579 / 45%)}.compose-row{display:flex;align-items:center;gap:10px;margin-top:8px}.hint{color:var(--faint);font:10px var(--mono)}.btn{border:1px solid var(--border);background:var(--card);padding:7px 12px;cursor:pointer}.btn:hover{background:var(--muted)}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--green);border-color:var(--green);color:#04150b;font-weight:700}.status{grid-area:status;display:flex;align-items:center;padding:0 14px;gap:18px;border-top:1px solid var(--border);background:var(--card2);font:10px var(--mono);color:var(--faint)}@media(max-width:700px){.shell{grid-template-columns:1fr;grid-template-rows:40px 1fr 22px;grid-template-areas:'top' 'main' 'status'}.side{display:none}.top a{display:none}.toolbar{padding:0 12px}.model{min-width:0;max-width:180px}.messages,.composer{padding-left:12px;padding-right:12px}}
</style></head><body><div class="shell"><header class="top"><div class="logo">M</div><div class="crumb"><b>MARS</b> / dashboard / <b>chat</b></div><div class="grow"></div><a href="/">← evaluation dashboard</a><span class="label">local</span></header><aside class="side"><div class="head"><span class="label">Conversations</span><span class="grow"></span><span class="label" id="chatCount">0</span></div><button class="btn primary new" id="newBtn">＋ New conversation</button><div class="chat-list" id="chatList"></div></aside><main class="main"><div class="toolbar"><span class="label">Model</span><select class="model" id="model"></select><span class="state" id="state">select a conversation</span></div><div class="messages" id="messages"><div class="empty">Start a conversation with any configured checkpoint.</div></div><form class="composer" id="composer"><textarea id="input" placeholder="Message the model…" maxlength="32000" disabled></textarea><div class="compose-row"><span class="hint">Enter to send · Shift+Enter for a new line</span><span class="grow"></span><button class="btn primary" id="send" disabled>Send ↗</button></div></form></main><footer class="status"><span>storage: <b>local JSON</b></b></span><span id="saveState">all messages saved automatically</span><span class="grow"></span><span id="clock"></span></footer></div>
<script>
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let chats=[],current=null,busy=false,eventSource=null;
const fmt=n=>n==null?'—':Number(n).toLocaleString();
async function api(url,options){const r=await fetch(url,options);if(!r.ok)throw Error((await r.json().catch(()=>({}))).detail||r.statusText);return r.json()}
function setState(text,kind=''){const el=$('#state');el.textContent=text;el.className='state '+kind;$('#saveState').textContent=kind==='error'?'response saved with error':'all messages saved automatically'}
function renderChats(){ $('#chatCount').textContent=chats.length;$('#chatList').innerHTML=chats.length?chats.map(c=>`<div class="chat ${current?.id===c.id?'active':''}" data-id="${esc(c.id)}"><div class="chat-title">${esc(c.title)}</div><div class="chat-meta">${esc(c.model)} · ${c.message_count} messages</div></div>`).join(''):'<div class="empty" style="padding:24px 14px">No saved chats</div>';document.querySelectorAll('.chat').forEach(e=>e.onclick=()=>loadChat(e.dataset.id))}
function renderMessages(){const box=$('#messages'),ms=current?.messages||[];if(!ms.length){box.innerHTML='<div class="empty">Start a conversation with this checkpoint.</div>';return}box.innerHTML=ms.map(m=>{const reasoning=m.reasoning?`<details class="reasoning"><summary>Reasoning · ${fmt(m.reasoning.length)} chars</summary><pre>${esc(m.reasoning)}</pre></details>`:'';const metrics=m.status==='completed'?`<div class="metrics">${fmt(m.elapsed_ms)}ms · ${m.completion_tokens==null?'tokens unavailable':fmt(m.completion_tokens)+' completion tokens'}${m.tok_per_sec?' · '+m.tok_per_sec+' tok/s':''}</div>`:'';return `<article class="msg ${m.role}"><div class="role">${m.role==='user'?'You':esc(current.model)}${m.status==='error'?' · ERROR':''}</div>${reasoning}<div class="bubble">${esc(m.content||m.error||'')}</div>${metrics}</article>`}).join('');box.scrollTop=box.scrollHeight}
async function refreshChats(){const d=await api('/api/chats');chats=d.chats||[];renderChats()}
async function loadChat(id){if(busy)return;current=await api('/api/chats/'+encodeURIComponent(id));$('#model').value=current.model;$('#input').disabled=false;$('#send').disabled=false;setState('ready');renderChats();renderMessages()}
async function newChat(){if(busy)return;const model=$('#model').value||'base';current=await api('/api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,title:'New conversation'})});await refreshChats();await loadChat(current.id);$('#input').focus()}
function appendLive(){let article=document.querySelector('.msg.live');if(!article){article=document.createElement('article');article.className='msg assistant live';article.innerHTML='<div class="role">'+esc(current.model)+'</div><details class="reasoning" hidden><summary>Reasoning</summary><pre></pre></details><div class="bubble"></div>';$('#messages').append(article)}return article}
async function send(){if(!current||busy)return;try{const text=$('#input').value.trim();if(!text)return;busy=true;$('#input').disabled=true;$('#send').disabled=true;current.messages.push({role:'user',content:text});$('#input').value='';renderMessages();setState('loading model','loading');const res=await fetch('/api/chats/'+current.id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text})});if(!res.ok){setState(await res.text(),'error');busy=false;return}eventSource={};const reader=res.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const part=await reader.read();if(part.done)break;buffer+=decoder.decode(part.value,{stream:true});const packets=buffer.split('\n\n');buffer=packets.pop();for(const packet of packets){const line=packet.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;const e=JSON.parse(line.slice(6));if(e.type==='status')setState(e.status==='loading'?'loading model':'generating','loading');if(e.type==='delta'){const a=appendLive();a.querySelector('.bubble').textContent+=e.delta;$('#messages').scrollTop=$('#messages').scrollHeight}if(e.type==='reasoning'){const a=appendLive(),d=a.querySelector('.reasoning');d.hidden=false;d.open=true;d.querySelector('pre').textContent+=e.delta}if(e.type==='done'){current=await api('/api/chats/'+current.id);setState('saved');renderMessages();await refreshChats()}if(e.type==='error'){setState(e.message,'error');await refreshChats()}if(e.type==='close'){busy=false;$('#input').disabled=false;$('#send').disabled=false;$('#input').focus()}}}if(busy){current=await api('/api/chats/'+current.id);renderMessages();await refreshChats();setState('saved');busy=false;$('#input').disabled=false;$('#send').disabled=false}}catch(e){setState('stream error: '+e.message,'error');try{current=await api('/api/chats/'+current.id);renderMessages();await refreshChats()}catch{}busy=false;$('#input').disabled=false;$('#send').disabled=false}}
$('#newBtn').onclick=newChat;$('#composer').onsubmit=e=>{e.preventDefault();send()};$('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#model').onchange=()=>{if(!current)return;newChat()};setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString(),1000);
(async()=>{try{const d=await api('/api/models');$('#model').innerHTML=(d.models||[]).map(m=>`<option value="${esc(m.id)}">${esc(m.label||m.id)}</option>`).join('');await refreshChats();if(chats[0])await loadChat(chats[0].id);else setState('choose a model')}catch(e){setState(e.message,'error')}})();
</script></body></html>
