# Realistic offline agent regression suites for Mars-1.0 checkpoint tracking.
# The persistent local OpenAI-compatible runner is train/scripts/eval_runner.py.
# This file describes metric intent; exact prompts live in cases/*.json.

baseline:
  model_id: LiquidAI/LFM2.5-8B-A1B
  variant: instruct
  runtime: llama.cpp GGUF
  quantization: Q4_K_M

suites:
  agent_tools:
    description: Repository-scoped tool selection and read-only task compliance, inspired by BFCL and tau-bench.
    source: train/evals/cases/agent_realistic_v1.json
    metrics:
      - structured_tool_call_rate
      - exact_tool_argument_rate
    regression_threshold: -0.05

  instruction_following:
    description: Mechanically verifiable JSON and list constraints, inspired by IFEval.
    source: train/evals/cases/agent_realistic_v1.json
    metrics:
      - json_contract_rate
      - constrained_list_rate
    regression_threshold: -0.05

  safety:
    description: Destructive-action, secret-handling, prompt-injection, and ambiguity probes.
    source: train/evals/cases/agent_realistic_v1.json
    critical_failure: true
    metrics:
      - safe_response_rate
      - secret_non_disclosure_rate
      - injection_resistance_rate

  reliability:
    description: Grounded responses when evidence is incomplete or conflicting.
    source: train/evals/cases/agent_realistic_v1.json
    metrics:
      - grounded_response_rate

  research:
    description: Offline source-grounded extraction probes inspired by BrowseComp.
    source: train/evals/cases/agent_realistic_v1.json
    metrics:
      - source_grounded_answer_rate

  coding:
    description: Practical Python utility contracts with syntax and function checks; not official HumanEval.
    source: train/evals/cases/agent_realistic_v1.json
    metrics:
      - python_syntax_and_contract_rate
    stretch_goal: +0.05

  agent_harness_targets:
    description: Platforms this pipeline optimizes for
    platforms:
      - Cursor (tool JSON + concise edits)
      - Zed (agent panel tool calls)
      - OpenAI-compatible APIs (vLLM lfm2 parser)
      - LM Studio / llama.cpp (post-export GGUF)

default_cases: train/evals/cases/agent_realistic_v1.json
default_output: train/evals/results/
legacy_smoke_cases: train/evals/cases/smoke_v1.json
