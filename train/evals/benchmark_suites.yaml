# Canonical smoke suites for Mars-1.0 checkpoint regression tracking.
# The persistent local OpenAI-compatible runner is train/scripts/eval_runner.py.
# This file describes metric intent; exact prompts live in cases/*.json.

baseline:
  model_id: LiquidAI/LFM2.5-8B-A1B
  variant: instruct
  runtime: llama.cpp GGUF
  quantization: Q4_K_M

suites:
  agent_tools:
    description: LFM bracket tool-call format (BFCL-lite)
    metrics:
      - lfm_tool_format_mean
      - tool_json_args_mean
      - tool_eval_accuracy
    regression_threshold: -0.05  # abort if drops >5% vs baseline

  instruction_following:
    description: IFEval-style keyword checks in GRPO rewards
    metrics:
      - ifeval_keyword_mean
    regression_threshold: -0.05

  qualitative:
    description: Versioned qualitative regression prompts
    source: train/evals/cases/smoke_v1.json
    count: 4

  coding:
    description: Coding smoke checks; not executable HumanEval
    metrics:
      - python_function_shape_rate
    stretch_goal: +0.05

  agent_harness_targets:
    description: Platforms this pipeline optimizes for
    platforms:
      - Cursor (tool JSON + concise edits)
      - Zed (agent panel tool calls)
      - OpenAI-compatible APIs (vLLM lfm2 parser)
      - LM Studio / llama.cpp (post-export GGUF)

eval_output: train/evals/results/
